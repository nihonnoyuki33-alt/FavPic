name: Build FavPic For Redmi

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build FavPic APK
        run: |
          # 1. Create clean project
          flutter create --org com.favpic favpic
          cd favpic

          # 2. Add dependencies
          flutter pub add http gal path_provider share_plus

          # 3. Create bulletproof Android Manifest with Internet permissions
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
              <application
                  android:label="FavPic"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # 4. Generate Core Application Code
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:gal/gal.dart';
          import 'package:http/http.dart' as http;
          import 'package:path_provider/path_provider.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const FavPicApp());
          }

          class FavPicApp extends StatelessWidget {
            const FavPicApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'FavPic',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF09090B),
                  colorScheme: const ColorScheme.dark(primary: Colors.cyanAccent),
                ),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});
            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            final TextEditingController _urlCtrl = TextEditingController();
            List<String> _mediaUrls = [];
            int _index = 0;
            bool _loading = false;

            Future<void> _fetchMedia(String raw) async {
              final match = RegExp(r'(https?:\/\/[^\s]+)').firstMatch(raw);
              final url = match != null ? match.group(0)! : raw.trim();
              if (url.isEmpty) return;

              FocusScope.of(context).unfocus();
              setState(() {
                _loading = true;
                _mediaUrls = [];
                _index = 0;
              });

              try {
                if (url.contains('youtube.com') || url.contains('youtu.be')) {
                  final id = RegExp(r'(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})').firstMatch(url)?.group(1);
                  if (id != null) {
                    setState(() => _mediaUrls = ['https://img.youtube.com/vi/$id/maxresdefault.jpg']);
                  }
                } else {
                  final clean = url.split('?').first;
                  final res = await http.get(Uri.parse(clean), headers: {
                    'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15'
                  }).timeout(const Duration(seconds: 8));

                  final matches = RegExp(r'<meta[^>]*property=["\']og:image["\'][^>]*content=["\']([^"\']+)["\']').allMatches(res.body);
                  final urls = matches.map((m) => m.group(1)!.replaceAll('&amp;', '&')).toSet().toList();

                  if (urls.isNotEmpty) {
                    setState(() => _mediaUrls = urls);
                  } else {
                    throw Exception('Could not locate public photo. Ensure account/post is public.');
                  }
                }
              } catch (e) {
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Error: $e')));
              } finally {
                setState(() => _loading = false);
              }
            }

            Future<void> _savePhoto() async {
              if (_mediaUrls.isEmpty) return;
              try {
                final hasAccess = await Gal.hasAccess();
                if (!hasAccess && !(await Gal.requestAccess())) {
                  throw Exception('Permission Denied');
                }

                final res = await http.get(Uri.parse(_mediaUrls[_index]));
                final dir = await getTemporaryDirectory();
                final f = File('${dir.path}/favpic_${DateTime.now().millisecondsSinceEpoch}.jpg');
                await f.writeAsBytes(res.bodyBytes);

                await Gal.putImage(f.path, album: 'FavPic');
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(content: Text('Saved directly to Photos/Gallery!'), backgroundColor: Colors.teal),
                  );
                }
              } catch (e) {
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Save error: $e')));
              }
            }

            @override
            void dispose() {
              _urlCtrl.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('FavPic', style: TextStyle(fontWeight: FontWeight.bold))),
                body: Padding(
                  padding: const EdgeInsets.all(16.0),
                  child: Column(
                    children: [
                      TextField(
                        controller: _urlCtrl,
                        decoration: InputDecoration(
                          hintText: 'Paste Instagram, YouTube, or web link...',
                          prefixIcon: const Icon(Icons.link, color: Colors.cyanAccent),
                          border: OutlineInputBorder(borderRadius: BorderRadius.circular(14)),
                          filled: true,
                          fillColor: const Color(0xFF16161D),
                        ),
                      ),
                      const SizedBox(height: 10),
                      SizedBox(
                        width: double.infinity,
                        height: 48,
                        child: FilledButton.icon(
                          onPressed: _loading ? null : () => _fetchMedia(_urlCtrl.text),
                          icon: const Icon(Icons.download, color: Colors.black),
                          label: const Text('Fetch Photo', style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold)),
                          style: FilledButton.styleFrom(backgroundColor: Colors.cyanAccent),
                        ),
                      ),
                      if (_loading) const Padding(padding: EdgeInsets.all(24), child: CircularProgressIndicator(color: Colors.cyanAccent)),
                      if (_mediaUrls.isNotEmpty && !_loading) ...[
                        const SizedBox(height: 16),
                        Expanded(
                          child: ClipRRect(
                            borderRadius: BorderRadius.circular(16),
                            child: Image.network(_mediaUrls[_index], fit: BoxFit.contain),
                          ),
                        ),
                        const SizedBox(height: 12),
                        SizedBox(
                          width: double.infinity,
                          height: 48,
                          child: ElevatedButton.icon(
                            onPressed: _savePhoto,
                            icon: const Icon(Icons.save_alt),
                            label: const Text('Save to Gallery (FavPic Album)'),
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.teal.shade700, foregroundColor: Colors.white),
                          ),
                        ),
                      ],
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          # 5. Build Release APK cleanly
          flutter build apk --release

      - name: Deliver APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FavPic-Installer
          path: favpic/build/app/outputs/flutter-apk/app-release.apk
