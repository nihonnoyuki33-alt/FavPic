name: Build FavPic For Redmi

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create & Assemble FavPic
        run: |
          # 1. Generate clean Flutter project
          flutter create --org com.favpic favpic
          cd favpic

          # 2. Add dependencies
          flutter pub add http gal path_provider image_cropper receive_sharing_intent share_plus

          # 3. Add Android permissions and Share Intent to AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>' android/app/src/main/AndroidManifest.xml
          
          sed -i '/<\/activity>/i \            <intent-filter>\n                <action android:name="android.intent.action.SEND" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <data android:mimeType="text/plain" />\n            </intent-filter>' android/app/src/main/AndroidManifest.xml

          # 4. Inject FavPic Core Engine into main.dart
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:io';
          import 'dart:typed_data';
          import 'dart:ui' as ui;
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:gal/gal.dart';
          import 'package:http/http.dart' as http;
          import 'package:image_cropper/image_cropper.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:receive_sharing_intent/receive_sharing_intent.dart';
          import 'package:share_plus/share_plus.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const FavPicApp());
          }

          class FavPicApp extends StatelessWidget {
            const FavPicApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'FavPic Ultra',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF09090B),
                  colorScheme: const ColorScheme.dark(primary: Colors.cyanAccent),
                ),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});
            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            final TextEditingController _urlCtrl = TextEditingController();
            StreamSubscription? _sub;
            List<String> _mediaUrls = [];
            int _index = 0;
            bool _loading = false;
            String _status = '';

            @override
            void initState() {
              super.initState();
              _sub = ReceiveSharingIntent.instance.getMediaStream().listen((shared) {
                if (shared.isNotEmpty && shared.first.path.isNotEmpty) {
                  _urlCtrl.text = shared.first.path;
                  _fetch(shared.first.path);
                }
              });
              ReceiveSharingIntent.instance.getInitialMedia().then((shared) {
                if (shared.isNotEmpty && shared.first.path.isNotEmpty) {
                  _urlCtrl.text = shared.first.path;
                  _fetch(shared.first.path);
                }
              });
            }

            Future<void> _fetch(String text) async {
              final match = RegExp(r'(https?:\/\/[^\s]+)').firstMatch(text);
              final url = match != null ? match.group(0)! : text.trim();
              if (url.isEmpty) return;

              setState(() {
                _loading = true;
                _status = 'Extracting media...';
                _mediaUrls = [];
              });

              try {
                if (url.contains('youtube.com') || url.contains('youtu.be')) {
                  final id = RegExp(r'(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})').firstMatch(url)?.group(1);
                  _mediaUrls = ['https://img.youtube.com/vi/$id/maxresdefault.jpg'];
                } else {
                  final clean = url.split('?').first;
                  final res = await http.get(Uri.parse(clean), headers: {
                    'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15'
                  });
                  final matches = RegExp(r'<meta[^>]*property=["\']og:image["\'][^>]*content=["\']([^"\']+)["\']').allMatches(res.body);
                  _mediaUrls = matches.map((m) => m.group(1)!.replaceAll('&amp;', '&')).toSet().toList();
                }
              } catch (e) {
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Error: $e')));
              } finally {
                setState(() => _loading = false);
              }
            }

            Future<void> _saveCurrent() async {
              if (_mediaUrls.isEmpty) return;
              try {
                final res = await http.get(Uri.parse(_mediaUrls[_index]));
                final dir = await getTemporaryDirectory();
                final f = File('${dir.path}/favpic_${DateTime.now().millisecondsSinceEpoch}.jpg');
                await f.writeAsBytes(res.bodyBytes);
                await Gal.putImage(f.path, album: 'FavPic');
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Saved directly to Photos/Gallery!')));
              } catch (e) {
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Save error: $e')));
              }
            }

            @override
            void dispose() {
              _sub?.cancel();
              _urlCtrl.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('FavPic Ultra', style: TextStyle(fontWeight: FontWeight.bold))),
                body: Padding(
                  padding: const EdgeInsets.all(16.0),
                  child: Column(
                    children: [
                      TextField(
                        controller: _urlCtrl,
                        decoration: InputDecoration(
                          hintText: 'Paste Instagram, YouTube, or web link...',
                          prefixIcon: const Icon(Icons.link, color: Colors.cyanAccent),
                          border: OutlineInputBorder(borderRadius: BorderRadius.circular(14)),
                          filled: true,
                          fillColor: const Color(0xFF16161D),
                        ),
                      ),
                      const SizedBox(height: 10),
                      SizedBox(
                        width: double.infinity,
                        height: 48,
                        child: FilledButton.icon(
                          onPressed: _loading ? null : () => _fetch(_urlCtrl.text),
                          icon: const Icon(Icons.download, color: Colors.black),
                          label: const Text('Fetch Photo', style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold)),
                          style: FilledButton.styleFrom(backgroundColor: Colors.cyanAccent),
                        ),
                      ),
                      if (_loading) const Padding(padding: EdgeInsets.all(20), child: CircularProgressIndicator(color: Colors.cyanAccent)),
                      if (_mediaUrls.isNotEmpty && !_loading) ...[
                        const SizedBox(height: 20),
                        Expanded(
                          child: ClipRRect(
                            borderRadius: BorderRadius.circular(16),
                            child: Image.network(_mediaUrls[_index], fit: BoxFit.contain),
                          ),
                        ),
                        const SizedBox(height: 12),
                        SizedBox(
                          width: double.infinity,
                          height: 48,
                          child: ElevatedButton.icon(
                            onPressed: _saveCurrent,
                            icon: const Icon(Icons.save_alt),
                            label: const Text('Save to Gallery (FavPic Album)'),
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.teal.shade700, foregroundColor: Colors.white),
                          ),
                        ),
                      ],
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          # 5. Build Release APK
          flutter build apk --release

      - name: Deliver APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FavPic-Installer
          path: favpic/build/app/outputs/flutter-apk/app-release.apk
